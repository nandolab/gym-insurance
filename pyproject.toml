[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-insurance"
version = "0.2.0.dev0"
description = "Versioned, reproducible Benford-proxy insurance selection research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "gymnasium>=0.29.1"]
authors = [{name = "Fernando Barbosa"}]

[project.optional-dependencies]
research = ["torch>=2", "scipy>=1.10"]
test = ["pytest>=8"]

[project.scripts]
gym-insurance = "gym_insurance.benchmark:main"

[tool.setuptools.packages.find]
include = ["gym_insurance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
